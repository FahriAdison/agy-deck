services:
  - type: web
    name: agy-deck
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Ganti dengan token login pilihanmu (string acak yang panjang).
      # Bisa juga diisi belakangan via dashboard Render → Environment.
      - key: AGY_WEB_TOKEN
        value: ganti-dengan-token-acak-panjang
